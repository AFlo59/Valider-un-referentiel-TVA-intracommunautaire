[project]
name = "meridian-tva"
version = "1.0.0"
description = "Validation d'un référentiel de numéros de TVA intracommunautaire : normalisation, contrôle structurel, vérification VIES, API de consultation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AFlo59" }]
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "truststore>=0.10",
]

[project.scripts]
meridian-tva = "meridian_tva.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_tva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
